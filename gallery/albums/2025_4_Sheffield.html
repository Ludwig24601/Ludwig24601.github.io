<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noai, noimageai">
  <title>2025 April B&W 400</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html" class="active">Film</a>
      <a href="../digital.html">Digital</a>
    </nav>
  </header>

  <main>
    <div class="album-header">
      <a class="back-link" href="../index.html">&larr; Back to Film</a>
      <p class="album-page-date">April, 2025</p>
      <h1 class="album-page-title">Sheffield-York-Nottingham, B&W ISO 400</h1>
    </div>
    

    <div class="album-text">
      <p>MGS 2025, Sheffield</p>
    </div>

    <section class="photo-grid">

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/sheffield_1.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/sheffield_2.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/arms.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/zelda.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item full-width">
        <img src="../photos/2025_4_BW/dan_sheffield.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

    </section>


    <div class="album-text">
      <p>York</p>
    </div>

    <section class="photo-grid">

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/york_1.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/york_2.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/york_3.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

      <figure class="photo-item">
        <img src="../photos/2025_4_BW/york_4.jpg" alt="" loading="lazy" decoding="async" draggable="false">
      </figure>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Hening Xu</p>
  </footer>

  <!-- Lightbox Image Viewer (using dialog elmt) -->
  <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <div class="lb-stage">
      <img id="lb-img" src="" alt="" draggable="false">
    </div>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
  </dialog>

  <script src="../lightbox.js"></script>
</body>
</html>
